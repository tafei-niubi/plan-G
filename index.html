<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>G计划</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===== HUD 环：角色配色 ===== */
    :root {
      --hud-primary: #00e5ff;
      --hud-secondary: #ff2d95;
      --hud-glow-rgb: 0, 229, 255;
      --role-accent: #00e5ff;
      --role-accent-hover: #33ecff;
      --role-glow: rgba(0, 229, 255, 0.4);
      --role-soft: rgba(0, 229, 255, 0.1);
      --role-border: rgba(0, 229, 255, 0.5);
    }
    body[data-role="maid"] {
      --hud-primary: #ffb347;
      --hud-secondary: #ff8fa3;
      --hud-glow-rgb: 255, 179, 71;
      --role-accent: #ffb347;
      --role-accent-hover: #ffc670;
      --role-glow: rgba(255, 179, 71, 0.4);
      --role-soft: rgba(255, 179, 71, 0.1);
      --role-border: rgba(255, 179, 71, 0.5);
    }
    body[data-role="guard"] {
      --hud-primary: #ff2d55;
      --hud-secondary: #ff9d00;
      --hud-glow-rgb: 255, 45, 85;
      --role-accent: #ff2d55;
      --role-accent-hover: #ff5577;
      --role-glow: rgba(255, 45, 85, 0.4);
      --role-soft: rgba(255, 45, 85, 0.1);
      --role-border: rgba(255, 45, 85, 0.5);
    }

    /* ===== HUD 全息环 ===== */
    #hud-ring {
      position: absolute;
      inset: -12%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
      color: var(--hud-primary);
      transition: color 0.6s ease;
    }
    #hud-ring svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 14px rgba(var(--hud-glow-rgb), 0.4));
      animation: hudBreathe 6s ease-in-out infinite;
      transition: filter 0.6s ease;
    }
    @keyframes hudBreathe {
      0%, 100% { opacity: 0.6; transform: scale(0.975); }
      50%      { opacity: 0.95; transform: scale(1.02); }
    }
    .hud-rotate-slow {
      transform-origin: 200px 200px;
      transform-box: view-box;
      animation: hudSpin 40s linear infinite;
    }
    .hud-rotate-rev {
      transform-origin: 200px 200px;
      transform-box: view-box;
      animation: hudSpinRev 20s linear infinite;
    }
    @keyframes hudSpin    { from { transform: rotate(0deg);   } to { transform: rotate(360deg); } }
    @keyframes hudSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg);   } }
    .hud-pulse {
      transform-origin: 200px 200px;
      transform-box: view-box;
      animation: hudPulse 4s ease-in-out infinite;
    }
    @keyframes hudPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .hud-core { animation: hudCore 2.4s ease-in-out infinite; }
    @keyframes hudCore { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    /* 能量脉冲：从中心向外扩散 */
.hud-energy-pulse {
  transform-origin: 200px 200px;
  transform-box: view-box;
  animation: energyPulse 3s ease-out infinite;
}
@keyframes energyPulse {
  0%   { transform: scale(0.4); opacity: 0.85; stroke-width: 2.2; }
  70%  { opacity: 0.25; }
  100% { transform: scale(3.2); opacity: 0;   stroke-width: 0.4; }
}
  </style>
</head>
<body data-role="captain">
  <div id="stage">
    <div id="pet-wrapper">

      <!-- ===== HUD 全息环（颜色由 CSS 变量控制） ===== -->
      <div id="hud-ring" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="hudGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="var(--hud-primary)" stop-opacity="0.28"/>
              <stop offset="55%"  stop-color="var(--hud-primary)" stop-opacity="0.06"/>
              <stop offset="100%" stop-color="var(--hud-primary)" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="hudRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="currentColor"/>
              <stop offset="50%"  stop-color="currentColor" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="currentColor"/>
            </linearGradient>
          </defs>

          <!-- 背景光晕 -->
          <circle cx="200" cy="200" r="196" fill="url(#hudGlow)" color="var(--hud-primary)"/>

          <!-- 最外刻度圈（慢速旋转） -->
          <g class="hud-rotate-slow">
            <circle cx="200" cy="200" r="182" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/>
            <circle cx="200" cy="200" r="182" fill="none" stroke="currentColor" stroke-width="6" stroke-opacity="0.7" stroke-dasharray="1.5 13"/>
          </g>

          <!-- 主光环（反向旋转，渐变分段） -->
          <g class="hud-rotate-rev">
            <circle cx="200" cy="200" r="156" fill="none" stroke="url(#hudRingGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="70 24 34 24"/>
          </g>

          <!-- 内虚线环（慢速旋转） -->
          <g class="hud-rotate-slow">
            <circle cx="200" cy="200" r="128" fill="none" stroke="var(--hud-secondary)" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="3 7"/>
          </g>

          <!-- 四角准星 -->
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.75">
            <line x1="200" y1="8"   x2="200" y2="28"/>
            <line x1="200" y1="372" x2="200" y2="392"/>
            <line x1="8"   y1="200" x2="28"  y2="200"/>
            <line x1="372" y1="200" x2="392" y2="200"/>
          </g>

          <!-- 中心三角 -->
          <g class="hud-pulse">
            <polygon points="200,108 284,254 116,254" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.55"/>
            <polygon points="200,132 260,240 140,240" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
          </g>

          <!-- 中心核心点 -->
           <!-- 能量脉冲环（向外扩散） -->
        <circle class="hud-energy-pulse" cx="200" cy="200" r="60"
        fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="200" cy="200" r="16" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.6"/>
          <circle class="hud-core" cx="200" cy="200" r="6" fill="currentColor"/>
        </svg>
      </div>

            <!-- 全息几何核心（替换原来的立绘） -->
      <img id="pet-image" src="assets/characters/captain.png" alt="G-舰长" />
    </div>

    <div id="bubble"></div>
    <div id="fx"></div>
    <div id="quick-panel" class="hidden"></div>

    <div id="pwd-confirm" class="sensitive-hidden" style="top:8%; left:6%;">
      <div class="sensitive-bubble" style="border-color:rgba(255,45,85,0.7); box-shadow:0 0 20px rgba(255,45,85,0.25), 0 4px 16px rgba(0,0,0,0.6);">
        <div class="sensitive-header" style="border-bottom-color:rgba(255,45,85,0.25);">
          <span class="sensitive-icon" style="color:#ff2d55;">⛨</span>
          <span class="sensitive-title-text" style="color:#ff2d55;">守卫发现疑似密码</span>
        </div>
        <div class="sensitive-body">
          <div class="sensitive-type" id="pwd-confirm-site">来自：未知网站</div>
          <div class="sensitive-preview" style="color:#ff2d55;" id="pwd-confirm-pass">••••••</div>
        </div>
        <div class="sensitive-tail" style="border-top-color:rgba(30,8,12,0.96); filter:drop-shadow(0 1px 0 rgba(255,45,85,0.7));"></div>
        <div style="display:flex; gap:8px; margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,45,85,0.2);">
          <button id="pwd-confirm-no" style="flex:1; padding:5px 10px; font-size:12px; background:transparent; color:#f5e8ea; border:1px solid rgba(255,45,85,0.4); border-radius:6px; cursor:pointer;">跳过</button>
          <button id="pwd-confirm-yes" style="flex:1; padding:5px 10px; font-size:12px; background:#ff2d55; color:#0d0808; border:1px solid #ff2d55; border-radius:6px; cursor:pointer; font-weight:600;">加入密码库</button>
        </div>
      </div>
    </div>

    <div id="sensitive-confirm" class="sensitive-hidden">
      <div class="sensitive-bubble">
        <div class="sensitive-header">
          <span class="sensitive-icon">⛨</span>
          <span class="sensitive-title-text">守卫提醒</span>
        </div>
        <div class="sensitive-body">
          <div class="sensitive-type" id="sensitive-type">检测到疑似敏感信息</div>
          <div class="sensitive-preview" id="sensitive-preview">••••••</div>
          <div class="sensitive-advice" id="sensitive-advice" style="font-size:11px; color:#a8888d; margin-top:8px; line-height:1.5; padding-top:8px; border-top:1px dashed rgba(255,157,0,0.2);"></div>
        </div>
        <div class="sensitive-tail"></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
