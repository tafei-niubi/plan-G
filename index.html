<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>G计划</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===== HUD 环：角色配色 ===== */
    :root {
      --hud-primary: #00e5ff;
      --hud-secondary: #ff2d95;
      --hud-glow-rgb: 0, 229, 255;
      --role-accent: #00e5ff;
      --role-bg: #0a1018;
      --role-accent-hover: #33ecff;
      --role-glow: rgba(0, 229, 255, 0.4);
      --role-soft: rgba(0, 229, 255, 0.1);
      --role-border: rgba(0, 229, 255, 0.5);
    }
    body[data-role="maid"] {
      --hud-primary: #ffb347;
      --hud-secondary: #ff8fa3;
      --hud-glow-rgb: 255, 179, 71;
      --role-accent: #ffb347;
      --role-bg: #1a1216;
      --role-accent-hover: #ffc670;
      --role-glow: rgba(255, 179, 71, 0.4);
      --role-soft: rgba(255, 179, 71, 0.1);
      --role-border: rgba(255, 179, 71, 0.5);
    }
    body[data-role="guard"] {
      --hud-primary: #ff2d55;
      --hud-secondary: #ff9d00;
      --hud-glow-rgb: 255, 45, 85;
      --role-accent: #ff2d55;
      --role-bg: #0d0808;
      --role-accent-hover: #ff5577;
      --role-glow: rgba(255, 45, 85, 0.4);
      --role-soft: rgba(255, 45, 85, 0.1);
      --role-border: rgba(255, 45, 85, 0.5);
    }

    /* ===== HUD 全息环 ===== */
    #hud-ring {
      position: absolute;
      inset: -12%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
      color: var(--hud-primary);
      transition: color 0.6s ease;
    }
    @keyframes hudBreathe {
      0%, 100% { opacity: 0.6; transform: scale(0.975); }
      50%      { opacity: 0.95; transform: scale(1.02); }
    }
    .hud-rotate-slow {
      transform-origin: 200px 200px;
      transform-box: view-box;
      animation: hudSpin 40s linear infinite;
    }
    .hud-rotate-rev {
      transform-origin: 200px 200px;
      transform-box: view-box;
      animation: hudSpinRev 20s linear infinite;
    }
    @keyframes hudSpin    { from { transform: rotate(0deg);   } to { transform: rotate(360deg); } }
    @keyframes hudSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg);   } }
    .hud-pulse {
      transform-origin: 200px 200px;
      transform-box: view-box;
      animation: hudPulse 4s ease-in-out infinite;
    }
    @keyframes hudPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .hud-core { animation: hudCore 2.4s ease-in-out infinite; }
    @keyframes hudCore { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    /* 能量脉冲：从中心向外扩散 */
.hud-energy-pulse {
  transform-origin: 200px 200px;
  transform-box: view-box;
  animation: energyPulse 3s ease-out infinite;
}
@keyframes energyPulse {
  0%   { transform: scale(0.4); opacity: 0.85; stroke-width: 2.2; }
  70%  { opacity: 0.25; }
  100% { transform: scale(3.2); opacity: 0;   stroke-width: 0.4; }
}

/* ===== 三套 HUD 独立显示控制 ===== */
.hud-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 14px rgba(var(--hud-glow-rgb), 0.4));
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
body[data-role="captain"] .hud-captain {
  opacity: 1;
  animation: hudBreathe 6s ease-in-out infinite;
}
body[data-role="maid"] .hud-maid {
  opacity: 1;
  animation: hudBreathe 8s ease-in-out infinite;
}
body[data-role="guard"] .hud-guard {
  opacity: 1;
  animation: hudBreathe 5s ease-in-out infinite;
}

/* 守卫专用：快速旋转 */
.hud-rotate-fast {
  transform-origin: 200px 200px;
  transform-box: view-box;
  animation: hudSpin 8s linear infinite;
}

/* 守卫专用：故障条纹闪烁 */
.hud-glitch {
  animation: glitchFlicker 3s steps(8, end) infinite;
}
@keyframes glitchFlicker {
  0%, 100% { opacity: 0.9; }
  20%      { opacity: 0.4; }
  22%      { opacity: 0.9; }
  60%      { opacity: 0.5; }
  62%      { opacity: 0.9; }
  80%      { opacity: 0.25; }
  82%      { opacity: 0.9; }
}

/* 守卫核心闪烁 */
.hud-core-guard {
  animation: coreFlash 1.6s ease-in-out infinite;
}
@keyframes coreFlash {
  0%, 100% { opacity: 0.5; }
  50%      { opacity: 1; }
}

/* ===== HUD 数据角标 ===== */
#hud-data {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: Consolas, 'Courier New', monospace;
  color: var(--hud-primary, #00e5ff);
  text-shadow: 0 0 6px currentColor;
  opacity: 0;
  transition: opacity 0.4s ease;
}

body[data-role="captain"] #hud-data,
body[data-role="guard"] #hud-data {
  opacity: 0.9;
}

/* 女仆不显示数据（她没有数据感） */
body[data-role="maid"] #hud-data {
  opacity: 0;
}

.hd-item {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  letter-spacing: 1px;
}

.hd-label {
  opacity: 0.5;
  font-size: 9px;
}

.hd-value {
  font-weight: 600;
}

.hd-top {
  top: 4%;
  left: 50%;
  transform: translateX(-50%);
}

.hd-left {
  top: 50%;
  left: 4%;
  transform: translateY(-50%);
}

.hd-right {
  top: 50%;
  right: 4%;
  transform: translateY(-50%);
  flex-direction: row-reverse;
}

.hd-bottom {
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);
}

.hd-slogan {
  font-size: 10px;
  letter-spacing: 3px;
  opacity: 0.7;
  font-weight: 500;
}

/* 角色口号不同 —— 通过 JS 切换文字 */
body[data-role="captain"] .hd-slogan {
  color: var(--hud-primary);
}
body[data-role="guard"] .hd-slogan {
  color: var(--hud-primary);
}
  </style>
</head>

    <div id="fx"></div>
    <div id="quick-panel" class="hidden"></div>
  </div>

  <div id="drop-overlay">
    <div class="drop-text">松手，把歌放进方舟</div>
  </div>

  <div id="music-player" class="hidden">
    <button id="music-prev" title="上一首">⇤</button>
    <button id="music-play" title="暂停">⏸暂停</button>
    <button id="music-next" title="下一首">⇥</button>
    <button id="music-close" title="关闭">✕</button>
    <div id="music-marquee">
      <span id="music-title">正在播放...</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
