name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: npm run dist

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body: |
            ## G计划 v2.0.0 正式发布

            **数据方舟 · 指挥官的数字生活中枢**

            ### 三位乘员

            - **◈ G-舰长**：战略与执行 — 笔记本 + AI 点评 + Shift+Alt+S 快捷键
            - **❀ 女仆**：健康与生活 — 综合提醒 + 7 种运动推荐
            - **⛨ 守卫**：安全与防护 — AES-256 密码库 + 浏览器扩展 + 网络巡检

            ### 核心亮点

            - 桌面字幕系统（逐字出现/消失 + 三角色专属样式）
            - 全息 HUD 环 + 角色专属配色（青 / 琥珀 / 红）
            - Splash 启动画面 + 彭罗斯三角应用图标
            - 系统状态驱动的台词（电量 / 网络 / CPU）

            ### 下载

            - **便携版**：双击即用，无需安装
            - **安装版**：自动创建桌面快捷方式

            首次运行如被 Windows Defender / 360 拦截，请选择「仍要运行」。这是因为未购买代码签名证书，属于常见误报。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}