<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>G计划</title>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  #splash {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a1018;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 0 60px rgba(255, 0, 21, 0.35),
      0 0 120px rgba(0, 229, 255, 0.15),
      inset 0 0 40px rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.35);
    animation: splashIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }
  @keyframes splashIn {
    0% {
      opacity: 0;
      transform: scale(0.92);
      filter: blur(6px) brightness(1.4);
    }
    60% {
      opacity: 1;
      filter: blur(0) brightness(1.1);
    }
    100% {
      opacity: 1;
      transform: scale(1);
      filter: blur(0) brightness(1);
    }
  }
  /* 关闭时的渐隐 */
  #splash.closing {
    animation: splashOut 0.45s ease-in forwards;
  }
  @keyframes splashOut {
    0% { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(0.96); filter: blur(4px) brightness(1.3); }
  }
  #splash img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    /* 图片边缘轻微暗角，和容器发光更好融合 */
    filter: contrast(1.05) saturate(1.05);
  }
  /* 图片四周的暗角遮罩 */
  #splash::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 55%,
      rgba(10, 16, 24, 0.35) 100%
    );
    pointer-events: none;
    z-index: 2;
    border-radius: 14px;
  }
  /* 顶部微弱高光 */
  #splash::after {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.8), transparent);
    pointer-events: none;
    z-index: 3;
  }
</style>
</head>
<body>
  <div id="splash">
    <img src="assets/splash.png" alt="G计划" />
  </div>
  <script>
   const splash = document.getElementById('splash');
document.addEventListener('click', () => {
  splash.classList.add('closing');
  setTimeout(() => {
    if (window.splashAPI) window.splashAPI.close();
  }, 420);
});
if (window.splashAPI && window.splashAPI.onFadeOut) {
  window.splashAPI.onFadeOut(() => {
    splash.classList.add('closing');
  });
}
  </script>
</body>
</html>
